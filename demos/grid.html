<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FryPan.js - GRID</title>
  <link rel="stylesheet" href="DemoFramework/DemoFramework.css" />
</head>

<body>
  <canvas></canvas>
  <script type="module">

    import DemoFramework from "./DemoFramework/DemoFramework.js";
    const canvas = document.querySelector("canvas");

    const gridSize = 8;

    const demo = new DemoFramework({
      viewportElement: canvas,
      maxZoomFactor: 75,
      // minZoomFactor: 0.5,
      // autoResize: false,
      // intensityCurve: 0,
      // autoDragCursor:false,
      // autoZoomCursor: false,
      enableMouseWheel: true,
      mouseWheelTakeover: true,
      autoZoomCursor: true,
      enableMouseDrag: true,
      dragKey: "Space",
      autoDragCursor: true
    });

    demo.onDraw = () => {

      demo.ctx.strokeStyle = "orange";

      const trueGridSize = gridSize * demo.scene.data.zoomFactor;

      const colsBefore = Math.abs(demo.scene.data.x) / trueGridSize;
      const xOffset = (colsBefore - Math.floor(colsBefore)) * trueGridSize;
      const rowsBefore = Math.abs(demo.scene.data.y) / trueGridSize;
      const yOffset = (rowsBefore - Math.floor(rowsBefore)) * trueGridSize;

      let x = demo.scene.data.x - xOffset;
      let y = demo.scene.data.y - yOffset;

      while (x < demo.scene.data.viewportWidth) {

        demo.ctx.beginPath();
        demo.ctx.moveTo(x, 0);
        demo.ctx.lineTo(x, demo.scene.data.viewportHeight);
        demo.ctx.stroke();

        x += trueGridSize;
      }

      while (y < demo.scene.data.viewportHeight) {

        demo.ctx.beginPath();
        demo.ctx.moveTo(0, y);
        demo.ctx.lineTo(demo.scene.data.viewportWidth, y);
        demo.ctx.stroke();

        y += trueGridSize;
      }
    }

  </script>
</body>

</html>
