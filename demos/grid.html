<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FryPan.js - GRID</title>
  <link rel="stylesheet" href="DemoFramework/DemoFramework.css" />
</head>

<body>
  <canvas></canvas>
  <script type="module">

    import DemoFramework from "./DemoFramework/DemoFramework.js";
    const canvas = document.querySelector("canvas");

    const gridSize = 8;

    const demo = new DemoFramework({
      viewportElement: canvas,
      maxZoomFactor: 75,
      enableMouseWheel: true,
      mouseWheelTakeover: true,
      autoZoomCursor: true,
      enableMouseDrag: true,
      dragKey: "Space",
      autoDragCursor: true
    });

    demo.onDraw = () => {

      demo.ctx.strokeStyle = "orange";

      const trueGridSize = gridSize * demo.scene.data.zoomFactor;

      let x = demo.scene.data.x;
      let y = demo.scene.data.y;

      const bottom = demo.scene.data.y + demo.scene.data.height;
      const right = demo.scene.data.x + demo.scene.data.width;

      while (x < right) {

        demo.ctx.beginPath();
        demo.ctx.moveTo(x, demo.scene.data.y);
        demo.ctx.lineTo(x, bottom);
        demo.ctx.stroke();

        x += trueGridSize;
      }

      while (y < bottom) {

        demo.ctx.beginPath();
        demo.ctx.moveTo(demo.scene.data.x, y);
        demo.ctx.lineTo(right, y);
        demo.ctx.stroke();

        y += trueGridSize;
      }
    }

  </script>
</body>

</html>
