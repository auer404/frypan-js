<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FryPan.js - Spherical</title>
  <link rel="stylesheet" href="DemoFramework/DemoFramework.css" />
</head>

<body>
  <canvas></canvas>
  <script type="module">

    import DemoFramework from "./DemoFramework/DemoFramework.js";
    const canvas = document.querySelector("canvas");

    const demo = new DemoFramework({
      viewportElement: canvas,
      width: 400,
      height: 400,
      spherical: true,
      maxZoomFactor: 5,
      minZoomFactor: 0.1,
      enableMouseWheel: true,
      mouseWheelTakeover: true,
      autoZoomCursor: true,
      enableMouseDrag: true,
      autoDragCursor: true
    });

    demo.onDraw = () => {

      demo.scene.forEachClone((clone) => {

        demo.ctx.strokeStyle = "orange";

        demo.ctx.beginPath();
        demo.ctx.rect(
          clone.scene.x,
          clone.scene.y,
          demo.scene.data.width,
          demo.scene.data.height
        );

        if (clone.scene.x == demo.scene.data.x && clone.scene.y == demo.scene.data.y) {
          demo.ctx.fillStyle = "yellow";
          demo.ctx.fill();
        }

        demo.ctx.stroke();

      });

    }

    demo.canvas.ondblclick = () => {
      demo.scene.setZoomTo(1);
      demo.scene.center();
    }

  </script>
</body>

</html>
